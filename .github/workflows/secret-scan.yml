# Are we about to publish a credential?
#
# Every push and pull request, because unlike documentation links this CAN be
# broken by a commit - and once a key is pushed to a remote it has to be
# treated as leaked and rotated, whatever happens to the commit afterwards.
#
# The check prints file, line and kind only, never the matched text, so a
# finding does not copy the secret into the CI log. See docs/credentials.md.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: the scanner uses only node: builtins and git.
      - name: Scan tracked files
        run: npm run check:secrets
